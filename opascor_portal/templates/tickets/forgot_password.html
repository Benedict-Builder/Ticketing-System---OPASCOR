{% extends 'tickets/base.html' %}
{% load static %}
{% block content %}
<style>
  .login-wrap {
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-card {
    width:480px;
    background:linear-gradient(160deg,#080c20 0%,#0d1440 100%);
    border-radius:12px;
    border:1px solid rgba(100,150,255,0.4);
    box-shadow:0 0 30px rgba(34,85,221,0.4);
    padding:50px 45px;
    display:flex;flex-direction:column;gap:28px;
  }
  .login-title { font-size:1.8rem;font-weight:700;color:#fff; }
  .login-sub { font-size:0.85rem;color:rgba(255,255,255,0.5);line-height:1.6; }
  .input-line {
    display:flex;align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:10px;gap:10px;
  }
  .input-line input {
    background:transparent;border:none;outline:none;
    color:#fff;font-size:0.95rem;width:100%;
  }
  .input-line input::placeholder { color:rgba(255,255,255,0.4); }
  .btn-login {
    background:linear-gradient(135deg,#1a3a9f,#2255dd);
    color:#fff;border:none;border-radius:30px;
    padding:13px;font-size:0.95rem;font-weight:700;
    cursor:pointer;width:100%;
    box-shadow:0 4px 20px rgba(34,85,221,0.5);
    transition:all 0.2s;
  }
  .btn-login:hover { transform:translateY(-2px); }
  .back-link { text-align:center;font-size:0.82rem; }
  .back-link a { color:#6ea4ff;text-decoration:none; }
</style>

<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">Forgot Password</h1>
    <p class="login-sub">Enter your registered email address and we'll send you a link to reset your password.</p>

    <form method="post" style="display:flex;flex-direction:column;gap:24px;">
      {% csrf_token %}
      <div class="input-line">
        <input type="email" name="email" placeholder="Enter your email address" required/>
        <span style="color:rgba(255,255,255,0.4);">✉️</span>
      </div>
      <button type="submit" class="btn-login">Send Reset Link</button>
    </form>

    <p class="back-link"><a href="{% url 'login' %}">← Back to Login</a></p>
  </div>
</div>
{% endblock %}
