{% extends 'tickets/base.html' %}
{% block content %}
<style>
  .dept-wrap { min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:40px 24px; }
  .dept-title { font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:700;color:#fff;text-align:center; }
  .dept-card { width:100%;max-width:500px;background:linear-gradient(160deg,#0d1535 0%,#0a0e1f 100%);border:1px solid var(--border);border-radius:16px;padding:40px 36px;box-shadow:0 0 40px rgba(34,85,221,0.2); }
  .dept-subtitle { font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:600;color:#fff;text-align:center;margin-bottom:24px; }
  .dept-btn { display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;margin-bottom:12px;background:rgba(26,58,143,0.15);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;font-weight:600;cursor:pointer;text-align:left;transition:all 0.2s; }
  .dept-btn:hover { background:rgba(34,85,221,0.25);border-color:var(--glow-blue);box-shadow:0 0 16px rgba(34,85,221,0.3);transform:translateX(4px); }
  .dept-icon { font-size:1.4rem;width:32px;text-align:center; }
</style>

<div class="dept-wrap">
  <h1 class="dept-title">Choose Department</h1>
  <div class="dept-card">
    <p class="dept-subtitle">Select Your Department</p>
    <form method="post">
      {% csrf_token %}
      {% for value, label in departments %}
        <button type="submit" name="department" value="{{ value }}" class="dept-btn">
          {% if value == 'Operations' %}<span class="dept-icon">💼</span>
          {% elif value == 'Finance' %}<span class="dept-icon">💰</span>
          {% elif value == 'Human Resources' %}<span class="dept-icon">👥</span>
          {% elif value == 'Information Technology' %}<span class="dept-icon">🖥</span>
          {% else %}<span class="dept-icon">🛡</span>{% endif %}
          {{ label }}
        </button>
      {% endfor %}
    </form>
  </div>
</div>
{% endblock %}
