{% extends 'tickets/base.html' %}
{% block content %}
<style>
  .login-wrap { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px; }
  .login-card {
    width:480px;
    background:linear-gradient(160deg,#080c20 0%,#0d1440 100%);
    border-radius:12px;border:1px solid rgba(100,150,255,0.4);
    box-shadow:0 0 30px rgba(34,85,221,0.4);
    padding:50px 45px;display:flex;flex-direction:column;gap:28px;
  }
  .input-line {
    display:flex;align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:10px;gap:10px;
  }
  .input-line input {
    background:transparent;border:none;outline:none;
    color:#fff;font-size:0.95rem;width:100%;
  }
  .input-line input::placeholder { color:rgba(255,255,255,0.4); }
  .btn-login {
    background:linear-gradient(135deg,#1a3a9f,#2255dd);color:#fff;border:none;
    border-radius:30px;padding:13px;font-size:0.95rem;font-weight:700;
    cursor:pointer;width:100%;
    box-shadow:0 4px 20px rgba(34,85,221,0.5);
  }
</style>
<div class="login-wrap">
  <div class="login-card">
    <h1 style="font-size:1.8rem;font-weight:700;color:#fff;">Set New Password</h1>
    <form method="post" style="display:flex;flex-direction:column;gap:24px;">
      {% csrf_token %}
      <div class="input-line">
        <input type="password" name="new_password1" placeholder="New password" required/>
        <span style="color:rgba(255,255,255,0.4);">🔒</span>
      </div>
      <div class="input-line">
        <input type="password" name="new_password2" placeholder="Confirm new password" required/>
        <span style="color:rgba(255,255,255,0.4);">🔒</span>
      </div>
      {% if form.errors %}
        <div style="background:rgba(204,26,26,0.15);border:1px solid rgba(204,26,26,0.4);color:#ff6b6b;padding:8px 14px;border-radius:6px;font-size:0.82rem;">
          {{ form.new_password2.errors }}
        </div>
      {% endif %}
      <button type="submit" class="btn-login">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
