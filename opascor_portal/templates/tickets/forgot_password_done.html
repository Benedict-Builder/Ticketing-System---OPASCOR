{% extends 'tickets/base.html' %}
{% block content %}
<style>
  .login-wrap { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px; }
  .login-card {
    width:480px;
    background:linear-gradient(160deg,#080c20 0%,#0d1440 100%);
    border-radius:12px;border:1px solid rgba(100,150,255,0.4);
    box-shadow:0 0 30px rgba(34,85,221,0.4);
    padding:50px 45px;display:flex;flex-direction:column;gap:20px;
  }
</style>
<div class="login-wrap">
  <div class="login-card">
    <div style="font-size:2.5rem;text-align:center;">✉️</div>
    <h1 style="font-size:1.5rem;font-weight:700;color:#fff;text-align:center;">Check your email</h1>
    <p style="font-size:0.85rem;color:rgba(255,255,255,0.5);text-align:center;line-height:1.6;">
      We've sent a password reset link to your email address. Please check your inbox and follow the instructions.
    </p>
    <a href="{% url 'login' %}" style="background:linear-gradient(135deg,#1a3a9f,#2255dd);color:#fff;border:none;border-radius:30px;padding:13px;font-size:0.95rem;font-weight:700;width:100%;text-align:center;text-decoration:none;display:block;margin-top:10px;">
      Back to Login
    </a>
  </div>
</div>
{% endblock %}
